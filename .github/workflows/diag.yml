name: Diagnostic téléchargement PDF
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          P="/contenu/telechargement/56649/446923/file/2026-11-03_RAA_N%C2%B073-2026-282.pdf"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          R="https://www.savoie.gouv.fr/Publications/Recueils-hebdomadaires-et-speciaux-des-actes-administratifs/2026-2"
          curl -s -c j.txt -A "$UA" -o /dev/null -w "page %{http_code}\n" "$R"
          for u in "https://www.savoie.gouv.fr$P" "https://www.savoie.gouv.fr/index.php$P" "https://savoie.gouv.fr$P" "https://www.savoie.gouv.fr/contenu/telechargement/56649/446923" "http://www.savoie.gouv.fr$P"; do
            for v in 1.1 2; do
              curl --http$v -sL -b j.txt -A "$UA" -H "Referer: $R" -H "Accept: application/pdf,*/*" -H "Accept-Language: fr-FR,fr" -m 90 -o o.pdf -w "$v %{http_code} %{size_download} $u\n" "$u" || echo "echec $v $u"
            done
          done
          head -c 8 o.pdf; echo
