name: Publication du tableau de bord
# La collecte (RAA, enquêtes publiques, consultations) est réalisée chaque lundi par la tâche
# de veille Perplexity, qui pousse data/alertes.json : le site de la préfecture bloque les
# téléchargements depuis les serveurs GitHub. Ce workflow publie le site à chaque mise à jour.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Préparer le site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r data site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
