name: Veille biodiversité hebdomadaire

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf

      - name: Vérifier les fichiers essentiels
        run: |
          echo "Fichiers présents :"
          find . -maxdepth 3 -type f -print
          test -f update_dashboard.py
          test -f index.html
          mkdir -p data
          if [ ! -f data/tableau_de_bord_veille_biodiversite.csv ]; then
            echo "CSV absent : il sera créé automatiquement lors de la première veille."
          fi

      - name: Mettre à jour la veille et les alertes
        run: |
          set -x
          python -u update_dashboard.py 2>&1 | tee data/journal_veille.txt

      - name: Enregistrer les nouveautés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer"
          else
            git commit -m "Veille hebdomadaire RAA Savoie et alertes - $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Préparer GitHub Pages
        run: |
          mkdir -p site
          cp -r data site/
          cp index.html site/

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publier les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
